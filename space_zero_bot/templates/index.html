<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Zero 0.2 - Signal Bot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>Space Zero 0.2</h1>
        <div class="logo-placeholder">[Logo Placeholder]</div>
        <nav>
            <a href="{{ url_for('logout') }}">Logout</a>
        </nav>
    </header>

    <main>
        <div class="controls">
            <div>
                <label for="trading-pair">Trading Pair:</label>
                <select id="trading-pair" name="trading_pair">
                    <!-- Options will be populated by JavaScript -->
                    <option value="">Loading pairs...</option>
                </select>
            </div>
            <div>
                <label for="lot-size">Lot Size:</label>
                <input type="number" id="lot-size" name="lot_size" value="0.1" step="0.01" min="0.01">
            </div>
            <button id="get-signal-btn">Get Signal</button>
        </div>

        <div class="signal-output-container">
            <h2>Signal:</h2>
            <div id="signal-output">
                Signals will appear here...
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 Space Zero 0.2</p>
    </footer>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
